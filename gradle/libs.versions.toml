[versions]
csi-core = "1.0.0-SNAPSHOT"
csi-transport = "1.0.0-SNAPSHOT"

[libraries]
shypl-tool-lang = "org.shypl.tool:tool-lang:1.0.0-SNAPSHOT"
shypl-tool-logging = { module = "org.shypl.tool:tool-logging", version = "1.0.0-SNAPSHOT"}
shypl-tool-utils = { module = "org.shypl.tool:tool-utils", version = "1.0.0-SNAPSHOT"}
shypl-tool-io = { module = "org.shypl.tool:tool-io", version = "1.0.0-SNAPSHOT"}
shypl-tool-biser = { module = "org.shypl.tool:tool-biser", version = "1.0.0-SNAPSHOT"}

shypl-csi-core-common = {module = "org.shypl.csi:csi-core-common", version.ref = "csi-core"}
shypl-csi-core-client = {module = "org.shypl.csi:csi-core-client", version.ref = "csi-core"}
shypl-csi-core-server = {module = "org.shypl.csi:csi-core-server", version.ref = "csi-core"}

shypl-csi-transport-common = {module = "org.shypl.csi:csi-transport-common", version.ref = "csi-transport"}
shypl-csi-transport-client = {module = "org.shypl.csi:csi-transport-client", version.ref = "csi-transport"}
shypl-csi-transport-server = {module = "org.shypl.csi:csi-transport-server", version.ref = "csi-transport"}

coroutines = {module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.8.1"}
